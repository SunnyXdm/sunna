[package]
name = "sunna-audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
# libopus, translated to Rust: no C toolchain or CMake needed on any platform.
unsafe-libopus = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia", "Win32_Security", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant",
] }
