[package]
name = "sunna-portal"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
sunna-capture.workspace = true
sunna-input.workspace = true
sunna-proto.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
libloading = "0.9.0"
# The desktop portal is on D-Bus; zbus is pure Rust, so building the host
# needs no new system packages.
zbus = "5"
