[package]
name = "sunna"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Sunna: remote desktop that feels native"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
sunna-client.workspace = true
sunna-proto.workspace = true
sunna-telemetry.workspace = true
sunna-viewer.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sunna-input.workspace = true

[features]
# The production build (scripts/install-mac-app.sh): the UI comes from the
# embedded assets and macOS takes the icon from the app bundle.
custom-protocol = ["tauri/custom-protocol"]
