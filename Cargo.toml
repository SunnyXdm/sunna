[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/transport",
    "crates/capture",
    "crates/codec",
    "crates/input",
    "crates/clipboard",
    "crates/host",
    "crates/client",
    "crates/telemetry",
    "crates/viewer",
    "apps/sunnad",
    "apps/sunna-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
sunna-proto = { path = "crates/proto" }
sunna-transport = { path = "crates/transport" }
sunna-viewer = { path = "crates/viewer" }
sunna-capture = { path = "crates/capture" }
sunna-codec = { path = "crates/codec" }
sunna-input = { path = "crates/input" }
sunna-clipboard = { path = "crates/clipboard" }
sunna-host = { path = "crates/host" }
sunna-client = { path = "crates/client" }
sunna-telemetry = { path = "crates/telemetry" }

anyhow = "1"
block2 = "0.6"
objc2 = "0.6"
bytes = "1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
softbuffer = "0.4"
winit = "0.30"
clap = { version = "4", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
qoi = "0.4"
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Plain HTTP only: telemetry goes to a collector on the private tailnet.
ureq = { version = "2", default-features = false }

[profile.release]
lto = "thin"
